<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Find boarding houses and apartments in Occidental Mindoro." />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>Occidental Mindoro StayFinder</title>
    <script>
      // Applies the saved theme before React mounts so the page never flashes light first.
      (function () {
        try {
          var stored = localStorage.getItem('stayfinder-theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var dark = stored === 'dark' || ((stored === null || stored === 'system') && prefersDark);
          if (dark) document.documentElement.classList.add('dark');
        } catch (error) {
          /* storage unavailable: keep the light default */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
